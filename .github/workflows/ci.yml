name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs in ~15s locally; this is just a runaway guard.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Must be `python -m pytest`, not bare `pytest`: there is no root conftest.py
      # or pytest.ini, so only the module form puts the project root on sys.path
      # (bare pytest fails with "ModuleNotFoundError: No module named 'db'").
      - name: Run tests
        run: python -m pytest -q

      # Explicit paths on purpose: pyflakes has no ignore support and would
      # otherwise recurse into .venv and report hundreds of vendor errors.
      - name: Lint
        run: >
          python -m pyflakes
          app.py config.py db.py auth.py helpers.py payroll.py seed.py migrate.py
          api tests

  container:
    # Verifies the Dockerfile, entrypoint, volume permissions, migrations, and
    # health check before Render ever sees the change.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t tea-factory:ci .

      - name: Boot container and probe the health check
        run: |
          docker run -d --name tea-factory-ci -p 8000:8000 \
            -e TEA_FACTORY_PRODUCTION=0 \
            -e TEA_FACTORY_SECURE_COOKIES=0 \
            -e TEA_FACTORY_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
            -v tea-factory-ci-data:/data \
            tea-factory:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo "Container health check did not become ready"
          docker logs tea-factory-ci
          exit 1

      - name: Tear down
        if: always()
        run: docker rm -f tea-factory-ci || true
